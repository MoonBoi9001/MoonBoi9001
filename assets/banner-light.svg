<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="A quiet moonscape at dawn: a small robot with a telescope watches a constellation shaped like a rising chart draw itself across the sky with a star for each of Rust, Python, Go, TypeScript, SQL, PostgreSQL, GraphQL, Docker, Kafka, Redpanda, Ansible, Kubernetes, Proxmox and Solidity, a purple flag stands planted in the surface, and the caption reads star chart, not price chart">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#CFDCF0"/><stop offset="100%" stop-color="#F3EEE6"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCD8CF"/>
      <stop offset="100%" stop-color="#D2CDC3"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="14"/></clipPath>
    <!-- a 4-point sparkle for the brightest star -->
    <g id="sparkle">
      <path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4 Z" fill="#c98a12" fill-opacity="0.95"/>
    </g>
    <!-- the friendly bot, same family as the repo banners -->
    <g id="bot">
      <line x1="0" y1="-26" x2="0" y2="-33" stroke="#1F2440" stroke-opacity="0.9" stroke-width="2"/>
      <circle class="beacon" cx="0" cy="-36" r="2.6" fill="#FFD98A" fill-opacity="0.95"/>
      <rect x="-14" y="-26" width="28" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.93" stroke="#9A8CF0" stroke-width="1.2"/>
      <circle cx="-5" cy="-16" r="2" fill="#3A22A6"/>
      <circle cx="5" cy="-16" r="2" fill="#3A22A6"/>
      <path d="M-5,-10 Q0,-6 5,-10" fill="none" stroke="#3A22A6" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="-8" y="-3" width="16" height="7" rx="2" fill="#3A22A6" fill-opacity="0.3"/>
      <line x1="-6" y1="8" x2="-6" y2="15" stroke="#9A8CF0" stroke-opacity="0.93" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="6" y1="8" x2="6" y2="15" stroke="#9A8CF0" stroke-opacity="0.93" stroke-width="3.4" stroke-linecap="round"/>
    </g>
    <style>
      /* the constellation draws itself in once over the first 7 seconds, then holds so it can be read */
      .cline {
        stroke-dasharray: 1110;
        animation: draw 22s linear 1 forwards;
      }
      @keyframes draw {
        0%    { stroke-dashoffset: 1110; }
        4.5%  { stroke-dashoffset: 1110; }
        32%   { stroke-dashoffset: 0; }
        100%  { stroke-dashoffset: 0; }
      }
      .v1 { animation: ignite1 22s linear 1 both; }
      .v2 { animation: ignite2 22s linear 1 both; }
      .v3 { animation: ignite3 22s linear 1 both; }
      .v4 { animation: ignite4 22s linear 1 both; }
      .v5 { animation: ignite5 22s linear 1 both; }
      .v6 { animation: ignite6 22s linear 1 both; }
      .v7 { animation: ignite7 22s linear 1 both; }
      .v8 { animation: ignite8 22s linear 1 both; }
      .v9 { animation: ignite9 22s linear 1 both; }
      .v10 { animation: ignite10 22s linear 1 both; }
      .v11 { animation: ignite11 22s linear 1 both; }
      .v12 { animation: ignite12 22s linear 1 both; }
      .v13 { animation: ignite13 22s linear 1 both; }
      .vspark { animation: ignite14 22s linear 1 both; }
      .caption { animation: captionIn 22s linear 1 both; }
      @keyframes ignite1 { 0%, 4.5% { opacity: 0; } 6.0% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite2 { 0%, 6.8% { opacity: 0; } 8.3% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite3 { 0%, 8.8% { opacity: 0; } 10.3% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite4 { 0%, 11.1% { opacity: 0; } 12.6% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite5 { 0%, 13.0% { opacity: 0; } 14.5% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite6 { 0%, 15.4% { opacity: 0; } 16.9% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite7 { 0%, 17.3% { opacity: 0; } 18.8% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite8 { 0%, 19.6% { opacity: 0; } 21.1% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite9 { 0%, 21.5% { opacity: 0; } 23.0% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite10 { 0%, 23.9% { opacity: 0; } 25.4% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite11 { 0%, 25.8% { opacity: 0; } 27.3% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite12 { 0%, 28.1% { opacity: 0; } 29.6% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite13 { 0%, 30.1% { opacity: 0; } 31.6% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite14 { 0%, 32.0% { opacity: 0; } 33.5% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes captionIn { 0%, 34% { opacity: 0; } 38%   { opacity: 1; } 100% { opacity: 1; } }
      /* background stars breathe on their own slow clocks */
      .stars circle { animation: twinkle 4.2s ease-in-out infinite alternate; }
      .stars circle:nth-of-type(2n) { animation-duration: 5.4s; animation-delay: 1.1s; }
      .stars circle:nth-of-type(3n) { animation-duration: 6.2s; animation-delay: 2.3s; }
      .stars circle:nth-of-type(5n) { animation-duration: 7s;   animation-delay: 0.6s; }
      @keyframes twinkle { from { opacity: 1; } to { opacity: 0.35; } }
      /* one shooting star per loop, while the constellation holds */
      .shoot { animation: shoot 22s linear infinite; opacity: 0; }
      @keyframes shoot {
        0%, 49% { opacity: 0; transform: translate(0, 0); }
        50%     { opacity: 0.9; }
        54%     { opacity: 0; transform: translate(420px, 150px); }
        100%    { opacity: 0; transform: translate(420px, 150px); }
      }
      /* the telescope sight-line drifts, the antenna light breathes */
      .sight { animation: march 2s linear infinite; }
      @keyframes march { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -16; } }
      .beacon { animation: pulse 2.8s ease-in-out infinite alternate; }
      @keyframes pulse { from { opacity: 1; } to { opacity: 0.45; } }
      /* honour reduced motion: hold the finished scene, no movement */
      @media (prefers-reduced-motion: reduce) {
        .cline, .v1, .v2, .v3, .v4, .v5, .v6, .v7, .v8, .v9, .v10, .v11, .v12, .v13, .vspark, .caption,
        .stars circle, .shoot, .sight, .beacon { animation: none; }
        .shoot { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="380" rx="14" fill="url(#sky)"/>
  <g clip-path="url(#frame)">

    <!-- background starfield -->
    <g class="stars" fill="#5B6B8A">
      <circle cx="60" cy="34" r="1.2" fill-opacity="0.55"/>
      <circle cx="1108" cy="38" r="1" fill-opacity="0.4"/>
      <circle cx="205" cy="30" r="1.4" fill-opacity="0.6"/>
      <circle cx="282" cy="58" r="1" fill-opacity="0.35"/>
      <circle cx="352" cy="26" r="1.2" fill-opacity="0.5"/>
      <circle cx="410" cy="96" r="1" fill-opacity="0.4"/>
      <circle cx="472" cy="40" r="1.3" fill-opacity="0.55"/>
      <circle cx="540" cy="22" r="1" fill-opacity="0.45"/>
      <circle cx="602" cy="58" r="1.2" fill-opacity="0.4"/>
      <circle cx="724" cy="24" r="1.3" fill-opacity="0.6"/>
      <circle cx="846" cy="70" r="1.2" fill-opacity="0.5"/>
      <circle cx="890" cy="20" r="1" fill-opacity="0.45"/>
      <circle cx="962" cy="66" r="1.2" fill-opacity="0.45"/>
      <circle cx="1032" cy="96" r="1" fill-opacity="0.4"/>
      <circle cx="1156" cy="86" r="1" fill-opacity="0.4"/>
      <circle cx="1180" cy="24" r="1.2" fill-opacity="0.5"/>
      <circle cx="30" cy="110" r="1" fill-opacity="0.35"/>
      <circle cx="40" cy="150" r="1.2" fill-opacity="0.5"/>
      <circle cx="96" cy="212" r="1" fill-opacity="0.4"/>
      <circle cx="172" cy="178" r="1.3" fill-opacity="0.55"/>
      <circle cx="238" cy="296" r="1" fill-opacity="0.35"/>
      <circle cx="300" cy="160" r="1.2" fill-opacity="0.5"/>
      <circle cx="372" cy="200" r="1.2" fill-opacity="0.5"/>
      <circle cx="428" cy="290" r="1" fill-opacity="0.4"/>
      <circle cx="588" cy="262" r="1" fill-opacity="0.35"/>
      <circle cx="640" cy="166" r="1.2" fill-opacity="0.5"/>
      <circle cx="712" cy="230" r="1.2" fill-opacity="0.5"/>
      <circle cx="760" cy="300" r="1" fill-opacity="0.4"/>
      <circle cx="820" cy="196" r="1.3" fill-opacity="0.55"/>
      <circle cx="876" cy="246" r="1" fill-opacity="0.35"/>
      <circle cx="930" cy="140" r="1.2" fill-opacity="0.5"/>
      <circle cx="990" cy="210" r="1.2" fill-opacity="0.5"/>
      <circle cx="1050" cy="160" r="1" fill-opacity="0.4"/>
      <circle cx="1100" cy="280" r="1.3" fill-opacity="0.55"/>
      <circle cx="1150" cy="200" r="1" fill-opacity="0.35"/>
      <circle cx="1184" cy="130" r="1.2" fill-opacity="0.5"/>
      <circle cx="520" cy="330" r="1.2" fill-opacity="0.5"/>
      <circle cx="700" cy="320" r="1" fill-opacity="0.4"/>
      <circle cx="1012" cy="318" r="1.3" fill-opacity="0.55"/>
      <circle cx="260" cy="330" r="1" fill-opacity="0.35"/>
    </g>

    <!-- one shooting star per loop -->
    <g class="shoot">
      <line x1="620" y1="8" x2="652" y2="17" stroke="#1F2440" stroke-opacity="0.9" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- a ringed planet in the empty corner of the sky; the ring passes behind it, then in front -->
    <g transform="translate(100,80) rotate(-16)" fill="none" stroke="#9AAED0" stroke-width="2.5" stroke-opacity="0.8">
      <path d="M-28,0 A28,7 0 0,1 28,0"/>
      <circle r="15" fill="#9AAED0" fill-opacity="0.9" stroke="none"/>
      <path d="M-28,0 A28,7 0 0,0 28,0"/>
    </g>

    <!-- the constellation: a rising chart that draws itself in -->
    <g class="scene">
      <polyline class="cline" points="165,261 232,196 300,235 367,170 434,209 502,144 569,183 636,117 703,156 771,91 838,130 905,65 973,104 1040,65"
                fill="none" stroke="#6d80a6" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="v1">
        <circle cx="165" cy="261" r="11" fill="#c98a12" fill-opacity="0.28"/>
        <circle cx="165" cy="261" r="5" fill="#c98a12"/>
        <text x="165" y="288" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34425c">Rust</text>
      </g>
      <g class="v2">
        <circle cx="232" cy="196" r="11" fill="#c98a12" fill-opacity="0.28"/>
        <circle cx="232" cy="196" r="5" fill="#c98a12"/>
        <text x="232" y="180" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34425c">Python</text>
      </g>
      <g class="v3">
        <circle cx="300" cy="235" r="11" fill="#c98a12" fill-opacity="0.28"/>
        <circle cx="300" cy="235" r="5" fill="#c98a12"/>
        <text x="300" y="262" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34425c">Go</text>
      </g>
      <g class="v4">
        <circle cx="367" cy="170" r="11" fill="#c98a12" fill-opacity="0.28"/>
        <circle cx="367" cy="170" r="5" fill="#c98a12"/>
        <text x="367" y="154" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34425c">TypeScript</text>
      </g>
      <g class="v5">
        <circle cx="434" cy="209" r="11" fill="#c98a12" fill-opacity="0.28"/>
        <circle cx="434" cy="209" r="5" fill="#c98a12"/>
        <text x="434" y="236" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34425c">SQL</text>
      </g>
      <g class="v6">
        <circle cx="502" cy="144" r="11" fill="#c98a12" fill-opacity="0.28"/>
        <circle cx="502" cy="144" r="5" fill="#c98a12"/>
        <text x="502" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34425c">PostgreSQL</text>
      </g>
      <g class="v7">
        <circle cx="569" cy="183" r="11" fill="#c98a12" fill-opacity="0.28"/>
        <circle cx="569" cy="183" r="5" fill="#c98a12"/>
        <text x="569" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34425c">GraphQL</text>
      </g>
      <g class="v8">
        <circle cx="636" cy="117" r="11" fill="#c98a12" fill-opacity="0.28"/>
        <circle cx="636" cy="117" r="5" fill="#c98a12"/>
        <text x="636" y="101" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34425c">Docker</text>
      </g>
      <g class="v9">
        <circle cx="703" cy="156" r="11" fill="#c98a12" fill-opacity="0.28"/>
        <circle cx="703" cy="156" r="5" fill="#c98a12"/>
        <text x="703" y="183" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34425c">Kafka</text>
      </g>
      <g class="v10">
        <circle cx="771" cy="91" r="11" fill="#c98a12" fill-opacity="0.28"/>
        <circle cx="771" cy="91" r="5" fill="#c98a12"/>
        <text x="771" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34425c">Redpanda</text>
      </g>
      <g class="v11">
        <circle cx="838" cy="130" r="11" fill="#c98a12" fill-opacity="0.28"/>
        <circle cx="838" cy="130" r="5" fill="#c98a12"/>
        <text x="838" y="157" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34425c">Ansible</text>
      </g>
      <g class="v12">
        <circle cx="905" cy="65" r="11" fill="#c98a12" fill-opacity="0.28"/>
        <circle cx="905" cy="65" r="5" fill="#c98a12"/>
        <text x="905" y="49" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34425c">Kubernetes</text>
      </g>
      <g class="v13">
        <circle cx="973" cy="104" r="11" fill="#c98a12" fill-opacity="0.28"/>
        <circle cx="973" cy="104" r="5" fill="#c98a12"/>
        <text x="973" y="131" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34425c">Proxmox</text>
      </g>
      <g class="vspark">
        <circle cx="1040" cy="65" r="13" fill="#c98a12" fill-opacity="0.28"/>
        <use href="#sparkle" transform="translate(1040,65) scale(1.5)"/>
        <text x="1030" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#34425c">Solidity</text>
      </g>
    </g>

    <g transform="translate(0,160)">
    <!-- the moon surface -->
    <path d="M0,152 C120,144 220,158 340,150 C460,142 560,156 700,148 C840,140 960,154 1080,146 C1140,142 1180,146 1200,144 L1200,220 L0,220 Z" fill="url(#ground)"/>
    <path d="M0,152 C120,144 220,158 340,150 C460,142 560,156 700,148 C840,140 960,154 1080,146 C1140,142 1180,146 1200,144" fill="none" stroke="#C4BFB3" stroke-opacity="1" stroke-width="2"/>

    <!-- craters -->
    <g fill="#6B6559" fill-opacity="0.2">
      <ellipse cx="160" cy="180" rx="30" ry="5"/>
      <ellipse cx="410" cy="198" rx="52" ry="8"/>
      <ellipse cx="650" cy="176" rx="20" ry="3.5"/>
      <ellipse cx="760" cy="204" rx="58" ry="9"/>
      <ellipse cx="1100" cy="170" rx="24" ry="4"/>
    </g>

    <text class="caption" x="1172" y="202" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" fill="#5C6474" fill-opacity="1">star chart, not price chart</text>

    <!-- a planted flag, quietly purple, hung from a crossbar as on the moon landings -->
    <g>
      <line x1="92" y1="152" x2="92" y2="108" stroke="#1F2440" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="92" y1="110" x2="124" y2="110" stroke="#1F2440" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M93,111 L123,111 L123,128 Q116,126 108,129 Q100,131 93,129 Z" fill="#6747ED" fill-opacity="0.95"/>
      <path d="M108,111 Q106,120 108,129" fill="none" stroke="#2A1A8C" stroke-opacity="0.35" stroke-width="1.2"/>
    </g>

    <!-- the bot peering through its telescope at the last star -->
    <g>
      <g transform="translate(958,98)">
        <line x1="0" y1="4" x2="-16" y2="56" stroke="#1F2440" stroke-opacity="0.9" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="0" y1="4" x2="16" y2="56" stroke="#1F2440" stroke-opacity="0.9" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="0" y1="4" x2="0" y2="58" stroke="#1F2440" stroke-opacity="0.9" stroke-width="2.2" stroke-linecap="round"/>
        <g transform="rotate(23)">
          <rect x="-6" y="14" width="11" height="9" rx="2.5" fill="#4A3DB8" stroke="#3A22A6" stroke-opacity="0.55" stroke-width="1.2"/>
          <rect x="-5" y="-14" width="9" height="30" rx="4" fill="#4A3DB8" stroke="#3A22A6" stroke-opacity="0.55" stroke-width="1.4"/>
          <rect x="-6.5" y="-17" width="12" height="5" rx="2.4" fill="#4A3DB8" stroke="#3A22A6" stroke-opacity="0.55" stroke-width="1.4"/>
        </g>
      </g>
      <line class="sight" x1="952" y1="83" x2="1040" y2="-87" stroke="#3B4A8C" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="2 6" stroke-linecap="round"/>
      <g transform="translate(930,132) scale(0.95)">
        <line x1="13" y1="-4" x2="19" y2="-11" stroke="#9A8CF0" stroke-opacity="0.95" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="20" cy="-13" r="3" fill="#FFFFFF" fill-opacity="0.95" stroke="#9A8CF0" stroke-width="1"/>
        <use href="#bot"/>
      </g>
    </g>

    </g>
  </g>
</svg>
