<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="A quiet moonscape at dawn: a small robot with a telescope watches a constellation shaped like a rising chart draw itself across the sky with a star for each of Rust, Python, Go, TypeScript, SQL, PostgreSQL, GraphQL, Docker, Kafka, Redpanda, Ansible, Kubernetes, Proxmox and Solidity, a purple flag stands planted in the surface, and the caption reads star chart, not price chart">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="30%" stop-color="#D9E0F7"/><stop offset="100%" stop-color="#B9C7F0"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D3D8E6"/>
      <stop offset="100%" stop-color="#AEB5C8"/>
    </linearGradient>
    <radialGradient id="earthball" cx="0.35" cy="0.35" r="0.9">
      <stop offset="0%" stop-color="#5B9BF0"/>
      <stop offset="70%" stop-color="#2E6FDB"/>
      <stop offset="100%" stop-color="#1B4CA8"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="380"/></clipPath>
    <clipPath id="earthclip"><circle cx="1108" cy="38" r="13"/></clipPath>
    <!-- a 4-point sparkle for the brightest star -->
    <g id="sparkle">
      <path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4 Z" fill="#1F2440" fill-opacity="0.95"/>
    </g>
    <!-- the friendly bot, same family as the repo banners -->
    <g id="bot">
      <line x1="0" y1="-26" x2="0" y2="-33" stroke="#1F2440" stroke-opacity="0.9" stroke-width="2"/>
      <circle class="beacon" cx="0" cy="-36" r="2.6" fill="#FFD98A" fill-opacity="0.95"/>
      <rect x="-14" y="-26" width="28" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.93" stroke="#9A8CF0" stroke-width="1.2"/>
      <circle cx="-5" cy="-16" r="2" fill="#3A22A6"/>
      <circle cx="5" cy="-16" r="2" fill="#3A22A6"/>
      <path d="M-5,-10 Q0,-6 5,-10" fill="none" stroke="#3A22A6" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="-8" y="-3" width="16" height="7" rx="2" fill="#3A22A6" fill-opacity="0.3"/>
      <line x1="-6" y1="8" x2="-6" y2="15" stroke="#FFFFFF" stroke-opacity="0.93" stroke-width="3.4" stroke-linecap="round"/>
      <line x1="6" y1="8" x2="6" y2="15" stroke="#FFFFFF" stroke-opacity="0.93" stroke-width="3.4" stroke-linecap="round"/>
    </g>
    <style>
      /* the constellation draws itself in once over the first 7 seconds, then holds so it can be read */
      .cline {
        stroke-dasharray: 1110;
        animation: draw 22s linear 1 forwards;
      }
      @keyframes draw {
        0%    { stroke-dashoffset: 1110; }
        4.5%  { stroke-dashoffset: 1110; }
        32%   { stroke-dashoffset: 0; }
        100%  { stroke-dashoffset: 0; }
      }
      .v1 { animation: ignite1 22s linear 1 both; }
      .v2 { animation: ignite2 22s linear 1 both; }
      .v3 { animation: ignite3 22s linear 1 both; }
      .v4 { animation: ignite4 22s linear 1 both; }
      .v5 { animation: ignite5 22s linear 1 both; }
      .v6 { animation: ignite6 22s linear 1 both; }
      .v7 { animation: ignite7 22s linear 1 both; }
      .v8 { animation: ignite8 22s linear 1 both; }
      .v9 { animation: ignite9 22s linear 1 both; }
      .v10 { animation: ignite10 22s linear 1 both; }
      .v11 { animation: ignite11 22s linear 1 both; }
      .v12 { animation: ignite12 22s linear 1 both; }
      .v13 { animation: ignite13 22s linear 1 both; }
      .vspark { animation: ignite14 22s linear 1 both; }
      .caption { animation: captionIn 22s linear 1 both; }
      @keyframes ignite1 { 0%, 4.5% { opacity: 0; } 6.0% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite2 { 0%, 6.8% { opacity: 0; } 8.3% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite3 { 0%, 8.8% { opacity: 0; } 10.3% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite4 { 0%, 11.1% { opacity: 0; } 12.6% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite5 { 0%, 13.0% { opacity: 0; } 14.5% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite6 { 0%, 15.4% { opacity: 0; } 16.9% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite7 { 0%, 17.3% { opacity: 0; } 18.8% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite8 { 0%, 19.6% { opacity: 0; } 21.1% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite9 { 0%, 21.5% { opacity: 0; } 23.0% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite10 { 0%, 23.9% { opacity: 0; } 25.4% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite11 { 0%, 25.8% { opacity: 0; } 27.3% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite12 { 0%, 28.1% { opacity: 0; } 29.6% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite13 { 0%, 30.1% { opacity: 0; } 31.6% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes ignite14 { 0%, 32.0% { opacity: 0; } 33.5% { opacity: 1; } 100% { opacity: 1; } }
      @keyframes captionIn { 0%, 34% { opacity: 0; } 38%   { opacity: 1; } 100% { opacity: 1; } }
      /* background stars breathe on their own slow clocks */
      .stars circle { animation: twinkle 4.2s ease-in-out infinite alternate; }
      .stars circle:nth-of-type(2n) { animation-duration: 5.4s; animation-delay: 1.1s; }
      .stars circle:nth-of-type(3n) { animation-duration: 6.2s; animation-delay: 2.3s; }
      .stars circle:nth-of-type(5n) { animation-duration: 7s;   animation-delay: 0.6s; }
      @keyframes twinkle { from { opacity: 1; } to { opacity: 0.35; } }
      /* one shooting star per loop, while the constellation holds */
      .shoot { animation: shoot 22s linear infinite; opacity: 0; }
      @keyframes shoot {
        0%, 49% { opacity: 0; transform: translate(0, 0); }
        50%     { opacity: 0.9; }
        54%     { opacity: 0; transform: translate(420px, 150px); }
        100%    { opacity: 0; transform: translate(420px, 150px); }
      }
      /* the telescope sight-line drifts, the antenna light breathes */
      .sight { animation: march 2s linear infinite; }
      @keyframes march { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -16; } }
      .beacon { animation: pulse 2.8s ease-in-out infinite alternate; }
      @keyframes pulse { from { opacity: 1; } to { opacity: 0.45; } }
      /* honour reduced motion: hold the finished scene, no movement */
      @media (prefers-reduced-motion: reduce) {
        .cline, .v1, .v2, .v3, .v4, .v5, .v6, .v7, .v8, .v9, .v10, .v11, .v12, .v13, .vspark, .caption,
        .stars circle, .shoot, .sight, .beacon { animation: none; }
        .shoot { opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="380" fill="url(#sky)"/>
  <g clip-path="url(#frame)">

    <!-- background starfield -->
    <g class="stars" fill="#1F2440">
      <circle cx="60" cy="34" r="1.2" fill-opacity="0.55"/>
      <circle cx="118" cy="72" r="1" fill-opacity="0.4"/>
      <circle cx="205" cy="30" r="1.4" fill-opacity="0.6"/>
      <circle cx="282" cy="58" r="1" fill-opacity="0.35"/>
      <circle cx="352" cy="26" r="1.2" fill-opacity="0.5"/>
      <circle cx="410" cy="96" r="1" fill-opacity="0.4"/>
      <circle cx="472" cy="40" r="1.3" fill-opacity="0.55"/>
      <circle cx="540" cy="22" r="1" fill-opacity="0.45"/>
      <circle cx="602" cy="58" r="1.2" fill-opacity="0.4"/>
      <circle cx="724" cy="24" r="1.3" fill-opacity="0.6"/>
      <circle cx="846" cy="70" r="1.2" fill-opacity="0.5"/>
      <circle cx="890" cy="20" r="1" fill-opacity="0.45"/>
      <circle cx="962" cy="66" r="1.2" fill-opacity="0.45"/>
      <circle cx="1032" cy="96" r="1" fill-opacity="0.4"/>
      <circle cx="1156" cy="86" r="1" fill-opacity="0.4"/>
      <circle cx="1180" cy="24" r="1.2" fill-opacity="0.5"/>
      <circle cx="30" cy="110" r="1" fill-opacity="0.35"/>
      <circle cx="40" cy="150" r="1.2" fill-opacity="0.5"/>
      <circle cx="96" cy="212" r="1" fill-opacity="0.4"/>
      <circle cx="172" cy="178" r="1.3" fill-opacity="0.55"/>
      <circle cx="238" cy="296" r="1" fill-opacity="0.35"/>
      <circle cx="300" cy="160" r="1.2" fill-opacity="0.5"/>
      <circle cx="372" cy="200" r="1.2" fill-opacity="0.5"/>
      <circle cx="428" cy="290" r="1" fill-opacity="0.4"/>
      <circle cx="588" cy="262" r="1" fill-opacity="0.35"/>
      <circle cx="640" cy="166" r="1.2" fill-opacity="0.5"/>
      <circle cx="712" cy="230" r="1.2" fill-opacity="0.5"/>
      <circle cx="760" cy="300" r="1" fill-opacity="0.4"/>
      <circle cx="820" cy="196" r="1.3" fill-opacity="0.55"/>
      <circle cx="876" cy="246" r="1" fill-opacity="0.35"/>
      <circle cx="930" cy="140" r="1.2" fill-opacity="0.5"/>
      <circle cx="990" cy="210" r="1.2" fill-opacity="0.5"/>
      <circle cx="1050" cy="160" r="1" fill-opacity="0.4"/>
      <circle cx="1100" cy="280" r="1.3" fill-opacity="0.55"/>
      <circle cx="1150" cy="200" r="1" fill-opacity="0.35"/>
      <circle cx="1184" cy="130" r="1.2" fill-opacity="0.5"/>
      <circle cx="520" cy="330" r="1.2" fill-opacity="0.5"/>
      <circle cx="700" cy="320" r="1" fill-opacity="0.4"/>
      <circle cx="1012" cy="318" r="1.3" fill-opacity="0.55"/>
      <circle cx="260" cy="330" r="1" fill-opacity="0.35"/>
    </g>

    <!-- one shooting star per loop -->
    <g class="shoot">
      <line x1="620" y1="8" x2="652" y2="17" stroke="#1F2440" stroke-opacity="0.9" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- earth, small and far away -->
    <g>
      <circle cx="1108" cy="38" r="14.5" fill="#5B9BF0" fill-opacity="0.18"/>
      <circle cx="1108" cy="38" r="13" fill="url(#earthball)"/>
      <g clip-path="url(#earthclip)">
        <path d="M1098,32 q5,-4 10,-1 q4,2 1,6 q-5,3 -9,0 q-4,-2 -2,-5 Z" fill="#3FA968" fill-opacity="0.9"/>
        <path d="M1108,45 q6,-3 10,1 q2,3 -2,5 q-6,2 -9,-2 q-2,-2 1,-4 Z" fill="#3FA968" fill-opacity="0.85"/>
        <circle cx="1114" cy="33" r="13" fill="#04050E" fill-opacity="0.3"/>
      </g>
    </g>

    <!-- the constellation: a rising chart that draws itself in -->
    <g class="scene">
      <polyline class="cline" points="165,276 232,211 300,250 367,185 434,224 502,159 569,198 636,132 703,171 771,106 838,145 905,80 973,119 1040,80"
                fill="none" stroke="#1F2440" stroke-opacity="0.3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <g class="v1">
        <circle cx="165" cy="276" r="5" fill="#1F2440" fill-opacity="0.1"/>
        <circle cx="165" cy="276" r="1.9" fill="#1F2440" fill-opacity="0.85"/>
        <text x="165" y="298" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1F2440" fill-opacity="0.8">Rust</text>
      </g>
      <g class="v2">
        <circle cx="232" cy="211" r="5" fill="#1F2440" fill-opacity="0.1"/>
        <circle cx="232" cy="211" r="2.2" fill="#1F2440" fill-opacity="0.95"/>
        <text x="232" y="195" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1F2440" fill-opacity="0.8">Python</text>
      </g>
      <g class="v3">
        <circle cx="300" cy="250" r="5" fill="#1F2440" fill-opacity="0.1"/>
        <circle cx="300" cy="250" r="1.9" fill="#1F2440" fill-opacity="0.85"/>
        <text x="300" y="272" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1F2440" fill-opacity="0.8">Go</text>
      </g>
      <g class="v4">
        <circle cx="367" cy="185" r="5" fill="#1F2440" fill-opacity="0.1"/>
        <circle cx="367" cy="185" r="2.2" fill="#1F2440" fill-opacity="0.95"/>
        <text x="367" y="169" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1F2440" fill-opacity="0.8">TypeScript</text>
      </g>
      <g class="v5">
        <circle cx="434" cy="224" r="5" fill="#1F2440" fill-opacity="0.1"/>
        <circle cx="434" cy="224" r="1.9" fill="#1F2440" fill-opacity="0.85"/>
        <text x="434" y="246" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1F2440" fill-opacity="0.8">SQL</text>
      </g>
      <g class="v6">
        <circle cx="502" cy="159" r="5" fill="#1F2440" fill-opacity="0.1"/>
        <circle cx="502" cy="159" r="2.2" fill="#1F2440" fill-opacity="0.95"/>
        <text x="502" y="143" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1F2440" fill-opacity="0.8">PostgreSQL</text>
      </g>
      <g class="v7">
        <circle cx="569" cy="198" r="5" fill="#1F2440" fill-opacity="0.1"/>
        <circle cx="569" cy="198" r="1.9" fill="#1F2440" fill-opacity="0.85"/>
        <text x="569" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1F2440" fill-opacity="0.8">GraphQL</text>
      </g>
      <g class="v8">
        <circle cx="636" cy="132" r="5" fill="#1F2440" fill-opacity="0.1"/>
        <circle cx="636" cy="132" r="2.2" fill="#1F2440" fill-opacity="0.95"/>
        <text x="636" y="116" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1F2440" fill-opacity="0.8">Docker</text>
      </g>
      <g class="v9">
        <circle cx="703" cy="171" r="5" fill="#1F2440" fill-opacity="0.1"/>
        <circle cx="703" cy="171" r="1.9" fill="#1F2440" fill-opacity="0.85"/>
        <text x="703" y="193" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1F2440" fill-opacity="0.8">Kafka</text>
      </g>
      <g class="v10">
        <circle cx="771" cy="106" r="5" fill="#1F2440" fill-opacity="0.1"/>
        <circle cx="771" cy="106" r="2.2" fill="#1F2440" fill-opacity="0.95"/>
        <text x="771" y="90" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1F2440" fill-opacity="0.8">Redpanda</text>
      </g>
      <g class="v11">
        <circle cx="838" cy="145" r="5" fill="#1F2440" fill-opacity="0.1"/>
        <circle cx="838" cy="145" r="1.9" fill="#1F2440" fill-opacity="0.85"/>
        <text x="838" y="167" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1F2440" fill-opacity="0.8">Ansible</text>
      </g>
      <g class="v12">
        <circle cx="905" cy="80" r="5" fill="#1F2440" fill-opacity="0.1"/>
        <circle cx="905" cy="80" r="2.2" fill="#1F2440" fill-opacity="0.95"/>
        <text x="905" y="64" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1F2440" fill-opacity="0.8">Kubernetes</text>
      </g>
      <g class="v13">
        <circle cx="973" cy="119" r="5" fill="#1F2440" fill-opacity="0.1"/>
        <circle cx="973" cy="119" r="1.9" fill="#1F2440" fill-opacity="0.85"/>
        <text x="973" y="141" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1F2440" fill-opacity="0.8">Proxmox</text>
      </g>
      <g class="vspark">
        <circle cx="1040" cy="80" r="7" fill="#1F2440" fill-opacity="0.12"/>
        <use href="#sparkle" transform="translate(1040,80)"/>
        <text x="1030" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#1F2440" fill-opacity="0.8">Solidity</text>
      </g>
      <text class="caption" x="543" y="300" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#1F2440" fill-opacity="0.75">star chart, not price chart</text>
    </g>

    <g transform="translate(0,190)">
    <!-- the moon surface -->
    <path d="M0,152 C120,144 220,158 340,150 C460,142 560,156 700,148 C840,140 960,154 1080,146 C1140,142 1180,146 1200,144 L1200,190 L0,190 Z" fill="url(#ground)"/>

    <!-- craters -->
    <g>
      <ellipse cx="150" cy="172" rx="20" ry="6" fill="#6E7488" fill-opacity="0.55"/>
      <path d="M132,170 Q150,163 168,170" fill="none" stroke="#DDE1EC" stroke-opacity="0.7" stroke-width="1.6"/>
      <ellipse cx="405" cy="180" rx="26" ry="7" fill="#6E7488" fill-opacity="0.5"/>
      <path d="M381,178 Q405,170 429,178" fill="none" stroke="#DDE1EC" stroke-opacity="0.7" stroke-width="1.6"/>
      <ellipse cx="742" cy="176" rx="16" ry="5" fill="#6E7488" fill-opacity="0.5"/>
      <path d="M727,174 Q742,168 757,174" fill="none" stroke="#DDE1EC" stroke-opacity="0.7" stroke-width="1.4"/>
      <ellipse cx="1130" cy="180" rx="22" ry="6" fill="#6E7488" fill-opacity="0.5"/>
      <path d="M1110,178 Q1130,171 1150,178" fill="none" stroke="#DDE1EC" stroke-opacity="0.7" stroke-width="1.6"/>
    </g>

    <!-- a planted flag, quietly purple -->
    <g>
      <line x1="92" y1="150" x2="92" y2="116" stroke="#1F2440" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M93,117 L124,122 L93,129 Z" fill="#6747ED" fill-opacity="0.95"/>
      <ellipse cx="92" cy="151" rx="7" ry="2.2" fill="#5A6076" fill-opacity="0.6"/>
    </g>

    <!-- the bot and its telescope, watching the last star -->
    <g>
      <g transform="translate(958,128)">
        <line x1="-6" y1="18" x2="-14" y2="34" stroke="#1F2440" stroke-opacity="0.9" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="6" y1="18" x2="14" y2="34" stroke="#1F2440" stroke-opacity="0.9" stroke-width="2.2" stroke-linecap="round"/>
        <line x1="0" y1="18" x2="0" y2="36" stroke="#1F2440" stroke-opacity="0.9" stroke-width="2.2" stroke-linecap="round"/>
        <g transform="rotate(19)">
          <rect x="-6" y="14" width="11" height="9" rx="2.5" fill="#4A3DB8" stroke="#3A22A6" stroke-opacity="0.55" stroke-width="1.2"/>
          <rect x="-5" y="-14" width="9" height="30" rx="4" fill="#4A3DB8" stroke="#3A22A6" stroke-opacity="0.55" stroke-width="1.4"/>
          <rect x="-6.5" y="-17" width="12" height="5" rx="2.4" fill="#4A3DB8" stroke="#3A22A6" stroke-opacity="0.55" stroke-width="1.4"/>
        </g>
      </g>
      <line class="sight" x1="953" y1="113" x2="1040" y2="-102" stroke="#3B4A8C" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="2 6" stroke-linecap="round"/>
      <g transform="translate(1006,132) scale(0.95)">
        <line x1="-13" y1="-8" x2="-24" y2="-18" stroke="#9A8CF0" stroke-opacity="0.95" stroke-width="3.4" stroke-linecap="round"/>
        <circle cx="-25" cy="-20" r="3" fill="#FFFFFF" fill-opacity="0.95" stroke="#9A8CF0" stroke-width="1"/>
        <use href="#bot"/>
      </g>
    </g>

    </g>
  </g>
</svg>
